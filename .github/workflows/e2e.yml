name: Testes E2E

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Executar aplicação e testes em containers
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Encerrar containers
        if: always()
        run: docker compose down --volumes

